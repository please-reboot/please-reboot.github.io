name: Build and publish resume

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install renderer
        run: npm install -g resumed jsonresume-theme-even

      - name: Validate resume.json
        run: node -e "JSON.parse(require('fs').readFileSync('resume.json','utf8')); console.log('resume.json is valid JSON')"

      - name: Render HTML
        run: |
          mkdir -p dist
          resumed render resume.json --theme jsonresume-theme-even --output dist/index.html

      - name: Copy resume.json into site
        run: cp resume.json dist/resume.json

      - name: Copy photo into site
        run: cp photo.jpg dist/photo.jpg

      - name: Copy CNAME into site
        run: cp cname.txt dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
